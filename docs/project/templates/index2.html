<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Potshed</title>
    <script type="module" src="https://js.arcgis.com/5.1/"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body data-logged-in="{{ 'true' if current_user.is_authenticated else 'false' }}">
    <h1 class="map-title">Potsherd Map</h1>
    <nav>
        <ul>
            <li><a href="{{ url_for('home') }}">Home</a></li>
            <li><a href="{{ url_for('about') }}">About</a></li>
            <li><a href="{{ url_for('contact') }}">Contact</a></li>
            {% if current_user.is_authenticated %}
                <li><span class="nav-user">{{ current_user.username }}</span></li>
                <li><a href="{{ url_for('logout') }}">Log out</a></li>
            {% else %}
                <li><a href="{{ url_for('login') }}">Log in</a></li>
                <li><a href="{{ url_for('register') }}">Register</a></li>
            {% endif %}
        </ul>
    </nav>
    <div class="map-container">
    <form id="coordinate-form">
    <label for="latitude">Enter Latitude:</label>
<input
  type="text"
  id="latitude"
  name="latitude"
  required
  minlength="4"
  maxlength="12"
  size="10" 
  placeholder="Enter Latitude"/>

        <label for="longitude">Enter Longitude:</label>

<input
  type="text"
  id="longitude"
  name="longitude"
  required
  minlength="4"
  maxlength="12"
  size="10" 
  placeholder="Enter Longitude"/>
<button class="submit-button" id="submit-button" type="button">Submit</button>
<button class="convert-button" id="convert-button" type="button">Convert</button>
{% if current_user.is_authenticated %}
    <button id="save-button" type="button">Save location</button>
{% endif %}
        <br><output name="zone" for="zone" id="zone"></output>
        <br><output name="easting" for="easting" id="easting"></output>
        <br><output name="northing" for="northing" id="northing"></output>

    </form>
    <div id="map"></div>
</div>
<script>const isLoggedIn = document.body.dataset.loggedIn === 'true';</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>


</html>
